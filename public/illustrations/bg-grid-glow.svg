<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(197, 235, 225, 0.15)" />
      <stop offset="100%" stop-color="transparent" />
    </radialGradient>
  </defs>
  
  <rect width="100%" height="100%" fill="url(#grid)" />
  
  <!-- Glowing orbs -->
  <circle cx="20%" cy="30%" r="300" fill="url(#glow)">
    <animate attributeName="cx" values="20%;25%;20%" dur="10s" repeatCount="indefinite" />
    <animate attributeName="cy" values="30%;35%;30%" dur="12s" repeatCount="indefinite" />
  </circle>
  <circle cx="80%" cy="70%" r="400" fill="url(#glow)">
    <animate attributeName="cx" values="80%;75%;80%" dur="15s" repeatCount="indefinite" />
    <animate attributeName="cy" values="70%;65%;70%" dur="11s" repeatCount="indefinite" />
  </circle>
</svg>
